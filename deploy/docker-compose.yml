name: avplayer

# Shared env file: cp deploy/.env.example deploy/.env
# Start everything: docker compose -f deploy/docker-compose.yml up --build
# Local model profile: docker compose -f deploy/docker-compose.yml --profile local up --build

services:
  agent:
    build:
      context: ..
      dockerfile: deploy/agent.Dockerfile
    image: avplayer-agent:local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AVPLAYER_PROJECT_ROOT: /app
      AVPLAYER_STORAGE_ROOT: /data/storage
      AVPLAYER_AGENT_BIND: 0.0.0.0
      AVPLAYER_AGENT_PORT: "50061"
      AVPLAYER_MCP_URL: ${AVPLAYER_MCP_URL:-http://host.docker.internal:8081/jsonrpc}
      AVPLAYER_MEDIA_SERVER: server:50062
      AVPLAYER_AI_PROVIDER: ${AVPLAYER_AI_PROVIDER:-cloud}
      AVPLAYER_OLLAMA_HOST: ${AVPLAYER_OLLAMA_HOST:-http://ollama:11434}
      AVPLAYER_DATA_SERVER: server:50066
    ports:
      - "${AVPLAYER_AGENT_PORT:-50061}:50061"
    volumes:
      - ${AVPLAYER_STORAGE_DIR:-../storage}:/data/storage
      - ${AVPLAYER_CONFIG_DIR:-../config}:/app/config:ro
      - ${AVPLAYER_RESOURCE_DIR:-../resource}:/app/resource:ro
    restart: unless-stopped
    # Both stores are optional at runtime (the agent degrades to disk), but a
    # Compose stack ships them so the dual-write path is exercised by default.
    depends_on:
      - redis
      - mysql

  rabbitmq:
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: ${MCP_RABBIT_USER:-avplayer}
      RABBITMQ_DEFAULT_PASS: ${MCP_RABBIT_PASSWORD:-avplayer-dev}
    ports:
      - "127.0.0.1:${MCP_RABBIT_PORT:-5672}:5672"
      - "127.0.0.1:${MCP_RABBIT_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${MCP_KAFKA_ADVERTISED_HOST:-127.0.0.1}:${MCP_KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:${MCP_KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${AVPLAYER_REDIS_PORT:-6379}:6379"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: avplayer
      MYSQL_USER: avplayer
      MYSQL_PASSWORD: ${AVPLAYER_MYSQL_PASSWORD:-avplayer}
      MYSQL_ROOT_PASSWORD: ${AVPLAYER_MYSQL_ROOT_PASSWORD:-avplayer-root}
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    ports:
      - "${AVPLAYER_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  zookeeper:
    profiles: ["discovery"]
    image: zookeeper:3.9.3
    environment:
      ZOO_STANDALONE_ENABLED: "true"
      ZOO_ADMINSERVER_ENABLED: "false"
    ports:
      - "${AVPLAYER_ZK_PORT:-2181}:2181"
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    image: avplayer-server:local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AVPLAYER_PROJECT_ROOT: /app
      AVPLAYER_STORAGE_ROOT: /data/storage
      AVPLAYER_KAFKA_BROKERS: ${AVPLAYER_KAFKA_BROKERS:-host.docker.internal:9092}
      AVPLAYER_KAFKA_TOPIC: ${AVPLAYER_KAFKA_TOPIC:-avplayer.playback.events}
      AVPLAYER_STATS_PROJECTION: ${AVPLAYER_STATS_PROJECTION:-playback-v1}
      AVPLAYER_AGENT_SERVER: agent:50061
      AVPLAYER_DATA_SERVER: localhost:50066
      AVPLAYER_DATA_SERVER_ADDRESS: 0.0.0.0:50066
      AVPLAYER_MEDIA_SERVER_ADDRESS: 0.0.0.0:50062
      AVPLAYER_WEB_GATEWAY_HOST: 0.0.0.0
      AVPLAYER_WEB_GATEWAY_PORT: "50065"
      AVPLAYER_MEDIA_ADVERTISE: ${AVPLAYER_MEDIA_ADVERTISE:-server:50062}
      AVPLAYER_ZK_HOSTS: ${AVPLAYER_ZK_HOSTS:-}
      AVPLAYER_ZK_MEDIA_PATH: ${AVPLAYER_ZK_MEDIA_PATH:-/avplayer/media}
      AVPLAYER_REDIS_URL: redis://redis:6379/0
      AVPLAYER_MYSQL_DSN: mysql://avplayer:${AVPLAYER_MYSQL_PASSWORD:-avplayer}@mysql:3306/avplayer
      AVPLAYER_ICE_SERVERS: ${AVPLAYER_ICE_SERVERS:-stun:stun.l.google.com:19302}
    ports:
      - "${AVPLAYER_WEB_GATEWAY_PORT:-50065}:50065"
      - "${AVPLAYER_DATA_PORT:-50066}:50066"
      - "${AVPLAYER_MEDIA_SERVER_PORT:-50062}:50062"
    volumes:
      - ${AVPLAYER_STORAGE_DIR:-../storage}:/data/storage
    depends_on:
      - redis
      - mysql
    restart: unless-stopped

  playback-stats:
    image: avplayer-server:local
    entrypoint: ["/build/playback_event_consumer"]
    environment:
      AVPLAYER_MYSQL_DSN: mysql://avplayer:${AVPLAYER_MYSQL_PASSWORD:-avplayer}@mysql:3306/avplayer
      AVPLAYER_KAFKA_BROKERS: ${AVPLAYER_KAFKA_BROKERS:-host.docker.internal:9092}
      AVPLAYER_KAFKA_TOPIC: ${AVPLAYER_KAFKA_TOPIC:-avplayer.playback.events}
      AVPLAYER_STATS_PROJECTION: ${AVPLAYER_STATS_PROJECTION:-playback-v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - server
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: avplayer-web:local
    ports:
      - "${AVPLAYER_WEB_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

  # Optional local-model backend. Pull a model once:
  #   docker compose -f deploy/docker-compose.yml --profile local \
  #     exec ollama ollama pull qwen3:4b
  ollama:
    profiles: ["local"]
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${AVPLAYER_OLLAMA_PORT:-11434}:11434"
    restart: unless-stopped

volumes:
  rabbitmq-data:
  kafka-data:
  ollama-models:
  mysql-data:
