[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avplayer-agent"
version = "0.2.0"
description = "AVPlayer agent service: gRPC orchestration, session storage and Web gateway"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "grpcio>=1.60,<2.0",
    "protobuf>=7.35,<8.0",
    "PyYAML>=6.0",
    "langchain>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langchain-ollama>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "faster-whisper>=1.1,<2.0",
    "av>=14,<19",
]

[project.optional-dependencies]
proto = ["grpcio-tools>=1.60,<2.0"]
dev = ["grpcio-tools>=1.60,<2.0"]

[project.scripts]
avplayer-agent = "avplayer_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["avplayer_agent*"]
